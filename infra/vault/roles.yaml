roles:
  - name: redis-role
    policy_file: redis-policy.hcl
    token_ttl: 1h
    token_max_ttl: 4h
    secret_id_ttl: 10m
    secret_id_num_uses: 1

  - name: postgres-role
    policy_file: postgres-policy.hcl
    token_ttl: 1h
    token_max_ttl: 4h
    secret_id_ttl: 10m
    secret_id_num_uses: 1