x-db-init: &db-init
  image: postgres:17
  entrypoint: [ "/bin/sh", "/scripts/db-init.sh" ]
  environment:
    POSTGRES_ADMIN_USER: ${POSTGRES_USER}
    POSTGRES_ADMIN_DB: ${POSTGRES_DB}
  volumes:
    - ./vault/scripts/db-init.sh:/scripts/db-init.sh:ro
    - postgres-config-rendered:/run/secrets:ro
  depends_on:
    postgres:
      condition: service_healthy
    vault-agent-postgres:
      condition: service_healthy
  networks:
    - sublio-network
  restart: "no"

services:

  #---------VAULT---------
  vault:
    image: hashicorp/vault:1.17
    container_name: vault
    ports:
      - "8200:8200"
    volumes:
      - ./vault/vault-server-${ENV}.hcl:/vault/config/vault.hcl:ro
      - vault-data:/vault/file
    cap_add:
      - IPC_LOCK
    command: server
    healthcheck:
      # 501 = sealed, это ОЖИДАЕМО до unseal - считаем это "живым" для healthcheck,
      # реальная готовность к работе появится только после unseal (шаг руками)
      test: [ "CMD-SHELL", "wget -qO- 'http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200' || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - sublio-network

  # --- Bootstrap: выдаёт свежий role-id/secret-id перед стартом агента ---
  vault-bootstrap-redis:
    image: hashicorp/vault:1.17
    container_name: vault-bootstrap-redis
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${BOOTSTRAP_TOKEN}
    entrypoint: [ "/scripts/bootstrap-approle.sh", "redis-role", "/vault/config" ]
    volumes:
      - ./vault/scripts/bootstrap-approle.sh:/scripts/bootstrap-approle.sh:ro
      - vault-approle-redis:/vault/config
    networks:
      - sublio-network
    restart: "no"

  vault-bootstrap-postgres:
    image: hashicorp/vault:1.17
    container_name: vault-bootstrap-postgres
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${BOOTSTRAP_TOKEN}
    entrypoint: [ "/scripts/bootstrap-approle.sh", "postgres-role", "/vault/config" ]
    volumes:
      - ./vault/scripts/bootstrap-approle.sh:/scripts/bootstrap-approle.sh:ro
      - vault-approle-postgres:/vault/config
    networks:
      - sublio-network
    restart: "no"

  vault-bootstrap-keycloak:
    image: hashicorp/vault:1.17
    container_name: vault-bootstrap-keycloak
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${BOOTSTRAP_TOKEN}
    entrypoint: [ "/scripts/bootstrap-approle.sh", "keycloak-role", "/vault/config" ]
    volumes:
      - ./vault/scripts/bootstrap-approle.sh:/scripts/bootstrap-approle.sh:ro
      - vault-approle-keycloak:/vault/config
    networks:
      - sublio-network
    restart: "no"

  # --- Vault Agent: логинится через AppRole, рендерит секрет в файл ---
  vault-agent-redis:
    image: hashicorp/vault:1.17
    container_name: vault-agent-redis
    entrypoint: [ "vault" ]
    depends_on:
      vault-bootstrap-redis:
        condition: service_completed_successfully
    volumes:
      - ./vault/agents/redis-agent.hcl:/vault/agents/redis-agent.hcl:ro
      - ./vault/templates/redis.conf.tpl:/vault/templates/redis.conf.tpl:ro
      - redis-config-rendered:/vault/rendered
      - vault-approle-redis:/vault/config
    command: agent -config=/vault/agents/redis-agent.hcl
    healthcheck:
      test: [ "CMD-SHELL", "test -f /vault/rendered/redis.conf" ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks:
      - sublio-network

  vault-agent-postgres:
    image: hashicorp/vault:1.17
    container_name: vault-agent-postgres
    entrypoint: [ "vault" ]
    depends_on:
      vault-bootstrap-postgres:
        condition: service_completed_successfully
    volumes:
      - ./vault/agents/postgres-agent.hcl:/vault/agents/postgres-agent.hcl:ro
      - ./vault/templates/postgres_password.tpl:/vault/templates/postgres_password.tpl:ro
      - postgres-config-rendered:/vault/rendered
      - vault-approle-postgres:/vault/config
    command: agent -config=/vault/agents/postgres-agent.hcl
    healthcheck:
      test: [ "CMD-SHELL", "test -f /vault/rendered/postgres_password.txt" ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks:
      - sublio-network


  vault-agent-keycloak:
    image: hashicorp/vault:1.17
    container_name: vault-agent-keycloak
    entrypoint: [ "vault" ]
    depends_on:
      vault-bootstrap-keycloak:
        condition: service_completed_successfully
      keycloak-db-init:
        condition: service_completed_successfully
    command: agent -config=/vault/agents/keycloak-agent.hcl
    volumes:
      - ./vault/agents/keycloak-agent.hcl:/vault/agents/keycloak-agent.hcl:ro
      - ./vault/templates/keycloak.env.tpl:/vault/templates/keycloak.env.tpl:ro
      - keycloak-config-rendered:/vault/rendered
      - vault-approle-keycloak:/vault/config
    healthcheck:
      test: [ "CMD-SHELL", "test -f /vault/rendered/keycloak.env" ]
      interval: 3s
      timeout: 2s
      retries: 20
    networks:
      - sublio-network

  # --- Реальные сервисы: ждут готового рендера от своего агента ---
  redis:
    image: redis:7-alpine
    container_name: redis
    depends_on:
      vault-agent-redis:
        condition: service_healthy
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis-config-rendered:/usr/local/etc/redis
      - redis_data:/data
    networks:
      - sublio-network

  postgres:
    image: postgres:17
    container_name: postgres
    depends_on:
      vault-agent-postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password.txt
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres-config-rendered:/run/secrets:ro
    networks:
      - sublio-network

  liquibase:
    image: liquibase/liquibase:4.29
    container_name: liquibase
    depends_on:
      postgres:
        condition: service_healthy
      vault-agent-postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        liquibase
        --changelog-file=changelog-master.yaml
        --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
        --username=${POSTGRES_USER}
        --password="$(cat /run/secrets/postgres_password.txt)"
        update
    volumes:
      - ./postgres/liquibase/db/changelog/changelog-master.yaml:/liquibase/changelog-master.yaml
      - ./postgres/liquibase/db/changelog/changesets:/liquibase/changesets
      - postgres-config-rendered:/run/secrets:ro
    networks:
      - sublio-network


  keycloak-db-init:
    <<: *db-init
    container_name: keycloak-db-init
    environment:
      POSTGRES_ADMIN_USER: ${POSTGRES_USER}
      POSTGRES_ADMIN_DB: ${POSTGRES_DB}
      OWNER_ROLE: keycloak_owner
      TARGET_DB: ${KEYCLOAK_POSTGRES_DB}
      CREATE_DB: "true"          # у keycloak своя отдельная база

  job-db-init:
    <<: *db-init
    container_name: job-db-init
    environment:
      POSTGRES_ADMIN_USER: ${POSTGRES_USER}
      POSTGRES_ADMIN_DB: ${POSTGRES_DB}
      OWNER_ROLE: job_owner
      TARGET_DB: ${POSTGRES_DB}
      CREATE_DB: "false"         # job-service живёт в общей sublio-базе

  subtitle-db-init:
    <<: *db-init
    container_name: subtitle-db-init
    environment:
      POSTGRES_ADMIN_USER: ${POSTGRES_USER}
      POSTGRES_ADMIN_DB: ${POSTGRES_DB}
      OWNER_ROLE: subtitle_owner
      TARGET_DB: ${POSTGRES_DB}
      CREATE_DB: "false"


  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -a
        . /vault/rendered/keycloak.env
        set +a
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm --metrics-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_POSTGRES_DB}
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_SPI_REALM_IMPORTER_OVERWRITE_EXISTING: "true"
    volumes:
      - keycloak-config-rendered:/vault/rendered:ro
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      vault-agent-keycloak:
        condition: service_healthy
      keycloak-db-init:
        condition: service_completed_successfully
    ports:
      - "8090:8080"
      - "9000:9000"
    networks:
      - sublio-network

volumes:
  vault-data:
  vault-approle-redis:
  vault-approle-postgres:
  vault-approle-keycloak:
  redis-config-rendered:
  postgres-config-rendered:
  redis_data:
  postgres_data:
  keycloak-config-rendered:

networks:
  sublio-network: