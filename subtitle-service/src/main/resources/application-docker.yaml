server:
  port: 8084

spring:
  config:
    import: "vault://"

  application:
    name: subtitle-service

  cloud:
    vault:
      uri: http://vault:8200
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID}
        secret-id-file: /vault/config/secret-id
      database:
        enabled: true
        role: subtitle_role
        backend: database

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://postgres:5432/${DB_NAME}


management:
  server:
    port: 8084
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      access: read_only
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0

otel:
  exporter:
    otlp:
      endpoint: ${OTLP_EXPORTER_ENDPOINT:http://alloy:4318}
      protocol: http/protobuf
  logs:
    exporter: none
  metrics:
    exporter: otlp

logging:
  config: "classpath:logback-spring.xml"

app:
  processed_file_dir: "/data/processed/"