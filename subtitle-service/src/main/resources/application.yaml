server:
  port: 8084

spring:
  application:
    name: subtitle-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/sublio
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}


management:
  server:
    port: 8084
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      access: read_only
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0

otel:
  exporter:
    otlp:
      endpoint: http://localhost:4318
      protocol: http/protobuf
  logs:
    exporter: none
  metrics:
    exporter: otlp

logging:
  config: "classpath:logback-spring.xml"