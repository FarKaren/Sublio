version: 3

# Variables from infra/.env (same place as the Nexus password in compose):
#   NEXUS_USERNAME=admin
#   NEXUS_PASSWORD=...
dotenv: ['.env']

vars:
    REGISTRY: '{{.REGISTRY | default "localhost:18083"}}'   # Nexus docker-hosted
    IMAGE_PREFIX: '{{.REGISTRY}}/sublio'
    # Services that get built into images (name = folder with a Dockerfile)
    SERVICES: auth-service job-service media-service subtitle-service
    REPO_ROOT:
        sh: git rev-parse --show-toplevel
    GIT_SHA:
        sh: git rev-parse --short HEAD

tasks:
    generate:
        desc: "OpenApi code generation — delegates to each service's own go:generate directive"
        dir: ".."
        cmds:
            - cd auth-service && go generate ./...
            - cd job-service && go generate ./...
            - cd media-service && go generate ./...

    # api-gateway
    sync-specs:
        desc: "Convert OpenAPI specs to JSON and copy into api-gateway for embedding"
        cmds:
            - rm -rf ../api-gateway/internal/openapi/specs
            - mkdir -p ../api-gateway/internal/openapi/specs
            - yq -o=json '.' ../api/auth-service.yaml     > ../api-gateway/internal/openapi/specs/auth-service.json
            - yq -o=json '.' ../api/job-service.yaml      > ../api-gateway/internal/openapi/specs/job-service.json
            - yq -o=json '.' ../api/media-service.yaml    > ../api-gateway/internal/openapi/specs/media-service.json
            - yq -o=json '.' ../api/subtitle-service.yaml > ../api-gateway/internal/openapi/specs/subtitle-service.json
    build-gateway:
        desc: "Build api-gateway (always syncs specs first)"
        deps: [ sync-specs ]
        dir: ../api-gateway
        cmds:
            - go build ./cmd/gateway
    run-gateway:
        desc: "Run api-gateway locally (always syncs specs first)"
        deps: [ sync-specs ]
        dir: ../api-gateway
        env:
            CONFIG_PATH: "./config/config.yaml"
        cmds:
            - go run ./cmd/gateway
    ci-check-specs:
        desc: "Fail if committed embedded specs are out of sync with api/*.yaml"
        cmds:
            - task: sync-specs
            - |
                if ! git diff --exit-code -- ../api-gateway/internal/openapi/specs; then
                  echo ""
                  echo "❌ api-gateway/internal/openapi/specs is out of sync with api/*.yaml"
                  echo ""
                  echo "Someone edited an OpenAPI spec under api/*.yaml but didn't"
                  echo "re-run the sync step and commit the result."
                  echo ""
                  echo "To fix, run locally:"
                  echo "  cd infra && task sync-specs"
                  echo "  git add ../api-gateway/internal/openapi/specs"
                  echo "  git commit -m 'sync embedded openapi specs'"
                  echo ""
                  exit 1
                fi

    # ─────────────────────────── Docker images → Nexus ───────────────────────────

    registry:login:
        desc: "Log Docker into Nexus docker-hosted"
        cmds:
            - echo "$NEXUS_PASSWORD" | docker login {{.REGISTRY}} -u "$NEXUS_USERNAME" --password-stdin

    image:build:
        desc: "Build an image. Example: task image:build SERVICE=subtitle-service TAG=0.1.0"
        requires:
            vars: [ SERVICE ]
        vars:
            TAG: '{{.TAG | default "dev"}}'
            # subtitle-service is built from the repo root (needs the api/ folder)
            CONTEXT: '{{if eq .SERVICE "subtitle-service"}}.{{else}}{{.SERVICE}}{{end}}'
        dir: '{{.REPO_ROOT}}'
        cmds:
            - >-
                docker build
                --provenance=false
                --sbom=false
                -f {{.SERVICE}}/Dockerfile
                -t {{.IMAGE_PREFIX}}/{{.SERVICE}}:{{.TAG}}
                -t {{.IMAGE_PREFIX}}/{{.SERVICE}}:sha-{{.GIT_SHA}}
                {{.CONTEXT}}

    image:push:
        desc: "Build and push an image. Example: task image:push SERVICE=subtitle-service TAG=0.1.0"
        requires:
            vars: [ SERVICE ]
        vars:
            TAG: '{{.TAG | default "dev"}}'
        cmds:
            - task: registry:login
            - task: image:build
              vars: { SERVICE: '{{.SERVICE}}', TAG: '{{.TAG}}' }
            - docker push {{.IMAGE_PREFIX}}/{{.SERVICE}}:{{.TAG}}
            - docker push {{.IMAGE_PREFIX}}/{{.SERVICE}}:sha-{{.GIT_SHA}}

    image:push-all:
        desc: "Build and push images for all services. Example: task image:push-all TAG=0.1.0"
        vars:
            TAG: '{{.TAG | default "dev"}}'
        cmds:
            - for: { var: SERVICES }
              task: image:push
              vars: { SERVICE: '{{.ITEM}}', TAG: '{{.TAG}}' }

    # ─────────────────────────── Client jar → Nexus ───────────────────────────

    jar:publish:
      desc: "Publish a jar to Nexus. Example: task jar:publish PROJECT=subtitle-service [MODULE=subtitle-service-client] [VERSION=0.1.0]"
      requires:
        vars: [ PROJECT ]
      vars:
        GRADLE_TASK: '{{if .MODULE}}:{{.MODULE}}:publish{{else}}publish{{end}}'
      dir: ../{{.PROJECT}}
      cmds:
        - ./gradlew {{.GRADLE_TASK}} --no-daemon {{if .VERSION}}-PreleaseVersion={{.VERSION}}{{end}}